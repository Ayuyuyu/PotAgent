protocol: "smb" #固定字段
application: "smb"
enable: true
# 监听地址
host: "0.0.0.0"
# 监听端口（常见 SMB 端口 445 / 139）
port: 445

# smb config
# 注意：version / server_name 是保留字段，当前实现（只读首 4 字节识别版本 + 回一个最小
# SMB2 NEGOTIATE 响应头）尚未使用它们；事件里的 smb.version 来自实际抓到的报文头，
# 不是这里配置的值。要伪造版本/服务器名需要先改代码。
version: "SMB3"
# server_name: "POTAGENT"
