protocol: "mysql"
application: "mysql"
enable: true
host: "0.0.0.0"        # 监听地址
port: 3306             # 监听端口

# 服务端版本号，驱动全部版本指纹（握手/VERSION()/@@version/sql_mode/认证插件等）。
# 留空默认 "5.7.42-log"；含 mariadb/percona 时自动识别风味，MariaDB 即便 ≥8 也保持 mysql_native_password。
version: "5.7.42-log"

# 认证插件（握手通告）。留空按版本推导；蜜罐不校验口令、一律放行。
# auth_plugin: "mysql_native_password"

# 预置库/表：SHOW DATABASES/TABLES 与 information_schema 可见（表列伪造 id/name/password 诱深入）。
databases:
  - "information_schema"
  - "mysql"
  - "performance_schema"
  - "test"
tables:
  - "users"
  - "accounts"
  - "orders"
  - "sessions"

# 以下为部署/版本指纹细节，留空取默认或按 version 推导，仅精确伪装时配置：
# version_comment: "MySQL Community Server - GPL"  # 发行风味（mariadb/percona 自动识别）
# hostname: "mysql-master"                          # @@hostname
# datadir: "/var/lib/mysql/"                        # @@datadir
# basedir: "/usr/"                                  # @@basedir
# socket: "/var/run/mysqld/mysqld.sock"             # @@socket
# sql_mode: "ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,..."  # 覆盖版本默认
# have_ssl: "YES"                                   # @@have_ssl
# max_connections: "151"                            # @@max_connections
