protocol: "telnet" #固定字段
application: "telnet"
enable: true
# 监听地址
host: "0.0.0.0"
# 监听端口（标准 telnet 端口 23）
port: 23

# telnet config
motd: |
  ********************************************************************************
  *             Copyright(C) 2008-2015 Huawei Technologies Co., Ltd.             *
  *                             All rights reserved                              *
  *                  Without the owner's prior written consent,                  *
  *           no decompiling or reverse-engineering shall be allowed.            *
  * Notice:                                                                      *
  *                   This is a private communication system.                    *
  *             Unauthorized access or use may lead to prosecution.              *
  ********************************************************************************
  
  Warning: Telnet is not a secure protocol, and it is recommended to use STelnet. 
  
  Login authentication
 
prompt: "$ "
# 主机名：command_sim 的内置命令（hostname/uname/提示符）会用到
hostname: "ubuntu"

# 伪造的系统信息：只影响 uname / /etc/os-release / /proc/version 等命令输出，
# 留空的字段使用内置默认值（Ubuntu 22.04.3 / 5.15.0-91-generic / x86_64）
system:
  distro: "Ubuntu"
  version: "22.04.3 LTS"
  version_id: "22.04"
  codename: "Jammy Jellyfish"
  codename_id: "jammy"
  kernel: "5.15.0-91-generic"
  kernel_version: "#101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023"
  machine: "x86_64"
  
# 账号口令：配了才校验（用户名+口令完全匹配）。
# 注意与 ftp/smtp 相反——accounts 留空时永远认证失败（4 次后断开），
# 但每次尝试的用户名/口令都会落事件。
accounts: 
  - username: "root"
    password: "123456"
  - username: "root"
    password: "root"
    
simulator:
  # pwd/ls/cd/cat 等已由内置命令模拟提供（会跟随 cd 变化），这里只保留自定义输出
  ps -ef: |
    UID        PID  PPID  C STIME TTY          TIME CMD
    user      1234     1  0 10:00 ?        00:00:00 /usr/lib/systemd/systemd
    user      5678  1234  0 10:01 ?        00:00:00 /usr/bin/gnome-shell
    user      9101  5678  0 10:02 ?        00:00:00 /usr/bin/nautilus
    user      1121  9101  0 10:03 ?        00:00:00 /usr/bin/gnome-terminal
  ps -aux: |
    USER         PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND
    user        1234  0.0  0.1  123456  12345 ?        Ssl  10:00   0:00 /usr/lib/systemd/systemd
    user        5678  0.1  0.2  234567  23456 ?        Ssl  10:01   0:00 /usr/bin/gnome-shell
    user        9101  0.0  0.1  345678  34567 ?        S    10:02   0:00 /usr/bin/nautilus
    user        1121  0.0  0.1  456789  45678 pts/0    S+   10:03   0:00 /usr/bin/gnome-terminal
