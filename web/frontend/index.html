<!DOCTYPE html>
<html lang="zh-CN" data-theme="console-blue">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>PotAgent 控制台</title>
    <script>
      // 首帧前恢复主题，避免刷新时闪白
      try {
        var saved = localStorage.getItem('potagent.admin.theme');
        if (saved === 'console-blue' || saved === 'emerald') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {
        /* 忽略隐私模式下的存储异常 */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
